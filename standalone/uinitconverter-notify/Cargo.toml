[package]
name = "uinitconverter-notify"
version = "0.2.0"
edition = "2021"
description = "systemd-notify replacement: sends sd_notify messages to $NOTIFY_SOCKET"

# The command is initconvert-notify; the crate and the package keep their names.
[[bin]]
name = "initconvert-notify"
path = "src/main.rs"

[dependencies]
libc = "0.2"
rustix = { version = "1.1", default-features = false, features = ["std", "event", "net", "pipe", "process", "time"] }

[profile.release]
lto = true
codegen-units = 1

# Its own project, not a member of the uinitconverter workspace above it.
[workspace]
