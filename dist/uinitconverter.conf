# /etc/uinitconverter/uinitconverter.conf — all keys are optional; defaults shown.
# The init system units are translated for (only s6 so far).
#INIT=s6
# Programs from other packages, by name -> what to run instead (blank-separated
# NAME=PROGRAM pairs). Unlisted names are looked up in PATH. Covers the s6/s6-rc
# tools, mount/umount/swapon/swapoff, useradd, journalctl and what
# `uinitconverter init` runs; not the shell scripts in the s6 service definitions.
#TOOLS="s6-svc=/opt/s6/bin/s6-svc"

#UNIT_PATH=/etc/systemd/system:/run/systemd/system:/usr/local/lib/systemd/system:/usr/lib/systemd/system
#RUNTIME_UNIT_DIR=/run/systemd/system
#PRESET_PATH=/etc/systemd/system-preset:/run/systemd/system-preset:/usr/local/lib/systemd/system-preset:/usr/lib/systemd/system-preset

# Hand-written s6-rc service stores, linked into the repository after the
# generated one: uinitconverter's early boot services, dbus and the daemon itself,
# then your own (a later store's service overrides an earlier one's).
# Directories that don't exist are left out.
#EXTRA_SOURCE=/etc/uinitconverter/s6:/etc/s6/sources

#STATE_DIR=/var/lib/uinitconverter
# The s6-rc repository (shared with the s6 command: s6.conf's repodir), the
# generated store it links (a symlink to the newest translation; default
# STATE_DIR/store) and the set a reload commits and installs.
#REPO_DIR=/var/lib/s6-rc/repository
#STORE_DIR=
#SET=current
# Services nothing boots or depends on are masked in that set, so they get
# no idle s6-supervise; uinitconverterd starts them on demand as dynamic
# services (STATE_DIR/auto-masked lists them). no: the next reload unmasks them.
#AUTO_MASK=yes
#LIVE_DIR=/run/s6-rc
#RUN_DIR=/run/uinitconverter
# Logging. With JOURNAL=yes (default) systemd-journald runs as an s6 service
# and service output goes to it: journalctl and `systemctl status` logs work.
# With JOURNAL=no each service gets an s6-log directory under LOG_DIR, and
# rsyslog.service is excluded (the s6 "syslog" service is the rsyslogd).
#JOURNAL=yes
# The syslog daemon of the s6 "syslog" service with JOURNAL=no: rsyslog or
# syslog-ng (uinitconverter init --syslog=). Read by that service's run script.
#SYSLOG=rsyslog
#JOURNAL_STDOUT=/run/systemd/journal/stdout
#LOG_DIR=/var/log/uinitconverter
# RESOLVED=no leaves systemd-resolved out; the "resolv" s6 service (in
# uinitconverter-sysinit, added by uinitconverter init --resolved=no) then makes
# NetworkManager handle DNS on this boot.
#RESOLVED=yes
# The s6 boot's system bus: daemon (dbus-daemon) or broker (dbus-broker, as
# on the systemd boot; falls back to dbus-daemon if it can't start). Read by
# the dbus s6 service; uinitconverter.bus= on the kernel command line wins.
#BUS=daemon

# Unit files created by StartTransientUnit (systemd-run).
#TRANSIENT_DIR=/run/systemd/transient

# Units never translated (globs). EXCLUDE_ADD appends, INCLUDE overrides.
#EXCLUDE=systemd-* initrd-* emergency.service rescue.service dbus-broker.service dbus.service plymouth-* kmod-static-nodes.service ldconfig.service uinitconverter*
#EXCLUDE_ADD=
# systemd's own services that work under uinitconverter. systemd-logind is what
# creates sessions and starts the user manager (user@UID.service) for GNOME.
#INCLUDE=systemd-logind.service systemd-user-sessions.service systemd-hostnamed.service systemd-localed.service systemd-timedated.service systemd-suspend.service systemd-hibernate.service systemd-hybrid-sleep.service systemd-suspend-then-hibernate.service systemd-logind-varlink.socket systemd-hostnamed.socket systemd-resolved.service systemd-resolved-varlink.socket systemd-resolved-monitor.socket systemd-vconsole-setup.service systemd-backlight@*.service

# systemd unit -> s6 service from EXTRA_SOURCE used instead as a dependency.
# DEP_MAP replaces the default list, DEP_MAP_ADD extends it.
#DEP_MAP_ADD=systemd-networkd.service=my-network

# Early boot services (in EXTRA_SOURCE); its members are always started.
#SYSINIT_BUNDLE=uinitconverter-sysinit
# The bundle s6-rc-set-commit makes of the set's active and always services:
# what boots (s6-linux-init's default runlevel).
#DEFAULT_BUNDLE=default
# s6 service that runs uinitconverterd (timers depend on it).
#DAEMON_SERVICE=uinitconverterd

# sd_booted() flag and the root-only peer-to-peer socket systemctl uses.
#BOOTED_FLAG=/run/systemd/system
#PRIVATE_SOCKET=/run/systemd/private
# Bus address for clients (timers) when the private socket is unavailable.
#BUS_ADDRESS=

# What generated s6 scripts run: services, and .timer/.path units.
#RUNNER=/usr/libexec/uinitconverter/uinitconverter-runner
#TIMER_RUNNER=/usr/libexec/uinitconverter/uinitconverter-timers
#POWEROFF_CMD=s6-linux-init-shutdown -p now
#REBOOT_CMD=s6-linux-init-shutdown -r now
#HALT_CMD=s6-linux-init-shutdown -h now

# Units in udev's SYSTEMD_WANTS (bluetooth.target, sound.target, ...) start
# when their device appears. UDEV_DIR is read at startup (empty: off);
# UDEV_MONITOR follows udevd's events for devices added later.
#UDEV_DIR=/run/udev
#UDEV_MONITOR=yes

# Non-root users allowed to start/stop/enable units over D-Bus.
#ALLOW_UIDS=
