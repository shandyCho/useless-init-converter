# Configuration of the s6 command (s6-frontend), written by sdcompat's
# `sdcompat init` from /usr/share/sdcompat/s6.conf.
# See /usr/share/doc/s6-frontend/s6.conf.html.
#
# The stores are the ones sdcompat links into the repository, in the same
# order: the translated systemd units (regenerated by `systemctl
# daemon-reload` / `sdcompat reload`), sdcompat's early-boot services, and
# your own s6-rc services. The set "current" decides what boots: use
# `s6 set enable|disable|mask`, then `s6 set commit --no-snapshot` and
# `s6 live install --no-snapshot` (s6-rc 0.8.0.2's snapshot check is
# unreliable). A reload commits and installs "current" too.
scandir = /run/service
livedir = /run/s6-rc
repodir = /var/lib/s6-rc/repository
bootdb = /var/lib/sdcompat/compiled
storelist = /var/lib/sdcompat/store:/etc/sdcompat/s6:/etc/s6/sources
