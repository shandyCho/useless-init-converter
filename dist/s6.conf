# Configuration of the s6 command (s6-frontend), written by sdcompat's
# setup-fedora.sh. See /usr/share/doc/s6-frontend/s6.conf.html.
#
# sdcompat compiles and installs the s6-rc database itself: do not use
# "s6 repository", "s6 set", "s6 live install" or "s6 system boot".
scandir = /run/service
livedir = /run/s6-rc
bootdb = /var/lib/sdcompat/compiled
