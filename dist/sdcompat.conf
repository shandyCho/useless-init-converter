# /etc/sdcompat/sdcompat.conf — all keys are optional; defaults shown.

#UNIT_PATH=/etc/systemd/system:/run/systemd/system:/usr/local/lib/systemd/system:/usr/lib/systemd/system
#RUNTIME_UNIT_DIR=/run/systemd/system
#PRESET_PATH=/etc/systemd/system-preset:/run/systemd/system-preset:/usr/local/lib/systemd/system-preset:/usr/lib/systemd/system-preset

# Hand-written s6-rc services compiled together with the generated ones
# (early boot, dbus, the sdcompat daemon itself, the "default" boot bundle).
#EXTRA_SOURCE=/etc/sdcompat/s6

#STATE_DIR=/var/lib/sdcompat
#LIVE_DIR=/run/s6-rc
#RUN_DIR=/run/sdcompat
# Logging. With JOURNAL=yes (default) systemd-journald runs as an s6 service
# and service output goes to it: journalctl and `systemctl status` logs work.
# With JOURNAL=no each service gets an s6-log directory under LOG_DIR.
#JOURNAL=yes
#JOURNAL_STDOUT=/run/systemd/journal/stdout
#LOG_DIR=/var/log/sdcompat
# RESOLVED=no leaves systemd-resolved out; the "resolv" s6 service (in
# sdcompat-sysinit, added by setup-fedora.sh --no-resolved) then makes
# NetworkManager handle DNS on this boot.
#RESOLVED=yes

# Unit files created by StartTransientUnit (systemd-run).
#TRANSIENT_DIR=/run/systemd/transient

# Units never translated (globs). EXCLUDE_ADD appends, INCLUDE overrides.
#EXCLUDE=systemd-* initrd-* emergency.service rescue.service dbus-broker.service dbus.service plymouth-* kmod-static-nodes.service ldconfig.service sdcompat*
#EXCLUDE_ADD=
# systemd's own services that work under sdcompat. systemd-logind is what
# creates sessions and starts the user manager (user@UID.service) for GNOME.
#INCLUDE=systemd-logind.service systemd-user-sessions.service systemd-hostnamed.service systemd-localed.service systemd-timedated.service systemd-suspend.service systemd-hibernate.service systemd-hybrid-sleep.service systemd-suspend-then-hibernate.service systemd-logind-varlink.socket systemd-hostnamed.socket systemd-resolved.service systemd-resolved-varlink.socket systemd-resolved-monitor.socket systemd-vconsole-setup.service systemd-backlight@*.service systemd-rfkill.socket systemd-rfkill.service

# systemd unit -> s6 service from EXTRA_SOURCE used instead as a dependency.
# DEP_MAP replaces the default list, DEP_MAP_ADD extends it.
#DEP_MAP_ADD=systemd-networkd.service=my-network

#SYSINIT_BUNDLE=sdcompat-sysinit
#DEFAULT_BUNDLE=sdcompat-default
# s6 service that runs sdcompatd (timers depend on it).
#DAEMON_SERVICE=sdcompatd

# sd_booted() flag and the root-only peer-to-peer socket systemctl uses.
#BOOTED_FLAG=/run/systemd/system
#PRIVATE_SOCKET=/run/systemd/private
# Bus address for clients (timers) when the private socket is unavailable.
#BUS_ADDRESS=

# What generated s6 scripts run: services, and .timer/.path units.
#RUNNER=/usr/libexec/sdcompat/sdcompat-runner
#TIMER_RUNNER=/usr/libexec/sdcompat/sdcompat-timers
#POWEROFF_CMD=s6-linux-init-shutdown -p now
#REBOOT_CMD=s6-linux-init-shutdown -r now
#HALT_CMD=s6-linux-init-shutdown -h now

# Units in udev's SYSTEMD_WANTS (bluetooth.target, sound.target, ...) start
# when their device appears. UDEV_DIR is read at startup (empty: off);
# UDEV_MONITOR follows udevd's events for devices added later.
#UDEV_DIR=/run/udev
#UDEV_MONITOR=yes

# Non-root users allowed to start/stop/enable units over D-Bus.
#ALLOW_UIDS=
