@version: 4.2
# syslog-ng for the s6 boot with JOURNAL=no (SYSLOG=syslog-ng): the same
# files as dist/rsyslog.conf (Fedora's rsyslog defaults). Installed as
# /etc/uinitconverter/syslog-ng.conf by `uinitconverter init`, so the
# distribution's /etc/syslog-ng/syslog-ng.conf stays as it is.
#
# Not system(), and /dev/log not as unix-dgram() when /run/systemd/system
# exists (uinitconverter creates it for sd_booted()): syslog-ng then
# believes systemd runs and turns both into journal or socket-activated
# sources. The s6 "syslog" run script sets UINITCONVERTER_DEVLOG to
# systemd-syslog() with /dev/log passed in LISTEN_FDS in that case, and to
# unix-dgram("/dev/log") otherwise.

options {
    chain_hostnames(off);
    keep_hostname(yes);
    stats(freq(0));
    flush_lines(0);
    perm(0600);
};

source s_local {
    `UINITCONVERTER_DEVLOG`;
    internal();
};

source s_kernel {
    file("/proc/kmsg" program_override("kernel") flags(kernel));
};

filter f_messages { level(info..emerg) and not facility(mail, authpriv, cron); };
filter f_secure { facility(authpriv); };
filter f_mail { facility(mail); };
filter f_cron { facility(cron); };
filter f_emerg { level(emerg); };
filter f_spooler { facility(uucp, news) and level(crit..emerg); };
filter f_boot { facility(local7); };

destination d_messages { file("/var/log/messages"); };
destination d_secure { file("/var/log/secure"); };
destination d_mail { file("/var/log/maillog" flush_lines(10)); };
destination d_cron { file("/var/log/cron"); };
destination d_users { usertty("*"); };
destination d_spooler { file("/var/log/spooler"); };
destination d_boot { file("/var/log/boot.log"); };

log { source(s_local); source(s_kernel); filter(f_messages); destination(d_messages); };
log { source(s_local); source(s_kernel); filter(f_secure); destination(d_secure); };
log { source(s_local); source(s_kernel); filter(f_mail); destination(d_mail); };
log { source(s_local); source(s_kernel); filter(f_cron); destination(d_cron); };
log { source(s_local); source(s_kernel); filter(f_emerg); destination(d_users); };
log { source(s_local); source(s_kernel); filter(f_spooler); destination(d_spooler); };
log { source(s_local); source(s_kernel); filter(f_boot); destination(d_boot); };
