[package]
name = "uinitconverter-runner"
version.workspace = true
edition.workspace = true
description = "Run one systemd service under s6 with systemd's execution semantics (initconvert-runner)"

# The command is initconvert-runner; the crate and the package keep their names.
[[bin]]
name = "initconvert-runner"
path = "src/main.rs"

[dependencies]
uinitconverter-version.workspace = true
uinitconverter-base.workspace = true
uinitconverter-install.workspace = true
uinitconverter-exec.workspace = true
uinitconverter-client.workspace = true
zbus.workspace = true
tokio.workspace = true
libc.workspace = true
