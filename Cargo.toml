[package]
name = "sdcompat"
version = "0.1.0"
edition = "2021"
description = "systemd compatibility layer on top of s6-rc: unit translation, service runner and org.freedesktop.systemd1 D-Bus API"

[dependencies]
zbus = { version = "5.19", default-features = false, features = ["tokio", "p2p"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "time", "sync", "fs", "io-util", "signal"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
libc = "0.2"
serde = "1"

[profile.release]
lto = true
codegen-units = 1
