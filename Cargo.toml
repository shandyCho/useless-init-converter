# sdcompat: the systemd compatibility layer, split into crates by role.
# The standalone tools in standalone/ are separate projects, not members.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
sdcompat-base = { path = "crates/sdcompat-base" }
sdcompat-install = { path = "crates/sdcompat-install" }
sdcompat-exec = { path = "crates/sdcompat-exec" }
sdcompat-client = { path = "crates/sdcompat-client" }
sdcompat-gen = { path = "crates/sdcompat-gen" }
zbus = { version = "5.19", default-features = false, features = ["tokio", "p2p"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "time", "sync", "fs", "io-util", "signal"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
libc = "0.2"
serde = "1"

[profile.release]
lto = true
codegen-units = 1
